name: Verify

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m compileall src
      - run: pytest -q

      - name: Live anonymous API connectivity smoke test
        env:
          FRANK_ENERGIE_USERNAME: ""
          FRANK_ENERGIE_PASSWORD: ""
          FRANK_ENERGIE_SITE_REFERENCE: ""
        run: python tests/live_api_connection.py

      - name: Live anonymous electricity price smoke test
        env:
          FRANK_ENERGIE_USERNAME: ""
          FRANK_ENERGIE_PASSWORD: ""
          FRANK_ENERGIE_SITE_REFERENCE: ""
        run: python tests/live_current_prices.py

      - name: Live anonymous MCP current electricity tariff smoke test
        env:
          FRANK_ENERGIE_USERNAME: ""
          FRANK_ENERGIE_PASSWORD: ""
          FRANK_ENERGIE_SITE_REFERENCE: ""
        run: python tests/live_mcp_current_prices.py

      - name: Live MCP protocol stdio integration smoke test
        env:
          FRANK_ENERGIE_USERNAME: ""
          FRANK_ENERGIE_PASSWORD: ""
          FRANK_ENERGIE_SITE_REFERENCE: ""
        run: python tests/live_mcp_protocol.py
