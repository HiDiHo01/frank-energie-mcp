[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "frank-energie-mcp"
version = "0.1.0"
description = "Model Context Protocol server for Frank Energie"
readme = "README.md"
requires-python = ">=3.14"
license = { text = "MIT" }
authors = [
  { name = "HiDiHo" }
]
dependencies = [
  "python-frank-energie",
]

[project.urls]
Homepage = "https://github.com/HiDiHo01/frank-energie-mcp"
Repository = "https://github.com/HiDiHo01/frank-energie-mcp"
Issues = "https://github.com/HiDiHo01/frank-energie-mcp/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM", "ASYNC"]

[tool.mypy]
python_version = "3.14"
strict = true
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
asyncio_mode = "auto"
